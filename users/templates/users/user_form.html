<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Form</title>
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body>
    <div class="container">
        <h1>{% if user.id %}Edit User{% else %}Create User{% endif %}</h1>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">{% if user.id %}Update{% else %}Create{% endif %}</button>
        </form>
        <a href="{% url 'user_list' %}">Back to User List</a>
    </div>
</body>
</html>
