
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Electric Shop Management</title>
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css">

</head>
<body>
<div class="flex items-center justify-center min-h-screen bg-gray-100">
    <div class="bg-white rounded-lg shadow-lg p-8 w-full max-w-md">
        <h2 class="text-2xl font-bold text-center text-blue-700 mb-6">Login to Your Account</h2>
        <form method="POST" action="{% url 'shop-login' %}">
            {% csrf_token %}
            <div class="mb-4">
                <label for="username" class="block font-medium mb-1">Username</label>
                <input type="text" id="username" name="username" required class="w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div class="mb-6">
                <label for="password" class="block font-medium mb-1">Password</label>
                <input type="password" id="password" name="password" required class="w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700 font-semibold transition">Login</button>
        </form>
        <div class="mt-6 text-center">
        </div>
        {% if messages %}
            <div class="mt-4">
                {% for message in messages %}
                    <div class="text-red-600 text-center">{{ message }}</div>
                {% endfor %}
            </div>
        {% endif %}
    </div>
</div>
</body>
</html>
